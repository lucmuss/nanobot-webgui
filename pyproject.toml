[project]
name = "nanobot-webgui"
version = "0.3.9"
description = "Production-focused browser GUI overlay for upstream nanobot"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "nanobot-ai @ git+https://github.com/HKUDS/nanobot.git@main",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/lucmuss/nanobot-webgui"
Repository = "https://github.com/lucmuss/nanobot-webgui"
Upstream = "https://github.com/HKUDS/nanobot"

[project.optional-dependencies]
matrix = [
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]

[project.scripts]
nanobot = "nanobot_webgui.cli:app"
nanobot-webgui = "nanobot_webgui.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["nanobot_webgui"]

# Include non-Python files in skills and templates
[tool.hatch.build]
include = [
    "nanobot_webgui/**/*.py",
    "nanobot_webgui/assets/**/*",
    "nanobot_webgui/static/**/*",
    "nanobot_webgui/templates/**/*.html",
]

[tool.hatch.build.targets.sdist]
include = [
    "nanobot_webgui/",
    "README.md",
    "WEBGUI.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
